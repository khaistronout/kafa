<div class="social-icons">
  {{ with .Site.Params.email }}
  <a href="mailto:{{ . }}" class="social-icon" aria-label="Email">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7 10-7"/></svg>
  </a>
  {{ end }}
  {{ with .Site.Params.linkedin }}
  <a href="{{ . }}" class="social-icon" target="_blank" rel="noopener" aria-label="LinkedIn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/><path d="M10 9v12M10 13a4 4 0 0 1 8 0v8"/></svg>
  </a>
  {{ end }}
  {{ with .Site.Params.github }}
  <a href="{{ . }}" class="social-icon" target="_blank" rel="noopener" aria-label="GitHub">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
  </a>
  {{ end }}
  {{ with .Site.Params.whatsapp }}
  <a href="{{ . }}" class="social-icon" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.4-4.1A8 8 0 1 1 9 18.6Z"/><path d="M9 10c0 2.5 2.5 5 5 5"/></svg>
  </a>
  {{ end }}
</div>
